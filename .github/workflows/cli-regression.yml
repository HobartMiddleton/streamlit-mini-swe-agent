name: CLI Regression

on:
  push:
    branches:
      - "develop"
  pull_request:
    types: [opened, synchronize, reopened]

# Avoid duplicate workflows on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  cli-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Streamlit code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read build information
        uses: ./.github/actions/build_info

      - name: Set up virtual environment
        uses: ./.github/actions/make_init
        with:
          python_version: ${{ env.PYTHON_MAX_VERSION }}

      - name: Fix apt mirrors
        uses: ./.github/actions/apt_mirror_fix

      - name: Install packaging system tool
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Build Python package
        run: make package

      - name: Install local package in production mode
        run: uv pip install --upgrade --force-reinstall lib/dist/*.whl

      - name: Run CLI regression tests
        env:
          SKIP_VERSION_CHECK: "true"
        run: pytest scripts/cli_regression_tests.py
